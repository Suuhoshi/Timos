{% extends 'base.html' %}
{% block title %}ログイン{% endblock %}

{% block content %}
<div class="container-sm">
  <p class="page-eyebrow">MEMBER LOGIN</p>
  <h1 class="page-title">ログイン</h1>

  <div class="card">
    <form action="/shopapp/login/" method="POST">
      {% csrf_token %}

      {% if message %}
        <div class="alert alert-error">{{ message }}</div>
      {% endif %}

      <div class="form-group">
        <label class="form-label">会員ID</label>
        {{ login_form.id }}
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        {{ login_form.password }}
      </div>

      <div style="margin-top: 28px;">
        <input type="submit" value="ログイン" class="btn btn-primary btn-full">
      </div>
    </form>
  </div>

  <p style="text-align:center; margin-top: 24px; font-size: 0.875rem; color: var(--ink-400);">
    会員登録がまだの方は
    <a href="/shopapp/register/" class="text-link">こちら</a>
  </p>
</div>
{% endblock %}
