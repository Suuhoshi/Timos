<!DOCTYPE html>
{% load static %}
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>会員ログイン</title>
    </head>
    <body>
        <h2>
            ログインしてください。
        </h2>

        <form action="/shopapp/login/" method="POST">
            {% csrf_token %}
            <table>
                {{ login_form }}
                <tr>
                    <td colspan="2"><input type="submit" value="ログイン"></td>
                </tr>
            </table>
            {% if message %}
                <div>{{ message }}</div>
            {% endif %}
        </form>
    </body>
</html>
