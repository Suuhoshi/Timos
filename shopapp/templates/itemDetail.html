{% extends 'base.html' %}
{% block title %}{{ item.name }}{% endblock %}

{% block content %}
<div class="container-md">
  <p class="page-eyebrow">ITEM DETAIL</p>
  <h1 class="product-name">{{ item.name }}</h1>
  <p class="product-price">¥{{ item.price|floatformat:"0" }}</p>

  <div class="card" style="margin-bottom: 32px;">
    <table class="detail-table">
      <tr>
        <th>色</th>
        <td>{{ item.color }}</td>
      </tr>
      <tr>
        <th>メーカー</th>
        <td>{{ item.manufacturer }}</td>
      </tr>
      <tr>
        <th>在庫数</th>
        <td>{{ item.stock }}個</td>
      </tr>
    </table>
  </div>

  <form action="/shopapp/cart/" method="post">
    {% csrf_token %}
    <input type="hidden" name="item_id" value="{{ item.item_id }}">
    <div class="action-group">
      <div class="form-group" style="margin-bottom:0;">
        <label class="form-label">数量</label>
        <select name="amount" style="width: 100px;">
          {% for i in range %}
            <option value="{{ i }}">{{ i }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn btn-accent" style="align-self: flex-end;">カートに入れる</button>
    </div>
  </form>

  <a href="/shopapp/" class="back-link">商品検索へ戻る</a>
</div>
{% endblock %}
