{% extends 'base.html' %}
{% block title %}会員登録{% endblock %}

{% block content %}
<div class="container-sm">
  <p class="page-eyebrow">REGISTER</p>
  <h1 class="page-title">会員登録</h1>

  <div class="card">
    <form action="/shopapp/register/confirm" method="POST">
      {% csrf_token %}

      {% if errors %}
        <div class="alert alert-error">{{ errors }}</div>
      {% endif %}

      <div class="form-group">
        <label class="form-label">会員ID</label>
        {{ form.user_id }}
      </div>
      <div class="form-group">
        <label class="form-label">パスワード</label>
        {{ form.password }}
      </div>
      <div class="form-group">
        <label class="form-label">パスワード（確認）</label>
        {{ form.password_confirm }}
      </div>
      <div class="form-group">
        <label class="form-label">お名前</label>
        {{ form.name }}
      </div>
      <div class="form-group">
        <label class="form-label">ご住所</label>
        {{ form.address }}
      </div>

      <div style="margin-top: 28px;">
        <button type="submit" class="btn btn-primary btn-full">登録内容を確認する</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
