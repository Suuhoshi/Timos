{% extends 'base.html' %}
{% block title %}商品検索{% endblock %}

{% block content %}
<div class="container">
  <p class="page-eyebrow">SEARCH</p>
  <h1 class="page-title">商品を探す</h1>

  <form action="search" method="get">
    <div class="search-form">
      <div class="form-group">
        <label class="form-label">カテゴリ</label>
        <select name="category_id">
          {% for category in categories %}
            <option value="{{ category.category_id }}">{{ category.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">キーワード</label>
        <input type="text" name="keyword" placeholder="例：麦わら帽子">
      </div>
      <button type="submit" class="btn btn-primary" style="margin-bottom: 0; flex-shrink: 0;">検索</button>
    </div>
  </form>
</div>
{% endblock %}
