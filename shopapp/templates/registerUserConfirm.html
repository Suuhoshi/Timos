{% extends 'base.html' %}
{% block title %}登録内容の確認{% endblock %}

{% block content %}
<div class="container-sm">
  <p class="page-eyebrow">CONFIRM</p>
  <h1 class="page-title">登録内容の確認</h1>

  <div class="card" style="margin-bottom: 24px;">
    <ul class="info-list">
      <li>
        <span class="info-label">会員ID</span>
        <span class="info-value">{{ form.user_id.value }}</span>
      </li>
      <li>
        <span class="info-label">パスワード</span>
        <span class="info-value">●●●●●●</span>
      </li>
      <li>
        <span class="info-label">お名前</span>
        <span class="info-value">{{ form.name.value }}</span>
      </li>
      <li>
        <span class="info-label">ご住所</span>
        <span class="info-value">{{ form.address.value }}</span>
      </li>
    </ul>
  </div>

  <form action="/shopapp/register/commit" method="post">
    {% csrf_token %}
    <input type="hidden" name="user_id" value="{{ form.user_id.value }}">
    <input type="hidden" name="password" value="{{ form.password.value }}">
    <input type="hidden" name="name" value="{{ form.name.value }}">
    <input type="hidden" name="address" value="{{ form.address.value }}">
    <button type="submit" class="btn btn-accent btn-full">この内容で登録する</button>
  </form>

  <a href="/shopapp/register/" class="back-link">入力へ戻る</a>
</div>
{% endblock %}
