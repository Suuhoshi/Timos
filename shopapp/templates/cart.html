<!DOCTYPE html>
<head>
    <title>ショッピングカート</title>
</head>
<body>
    <h2>ショッピングカート内の商品</h2>

<table border="1">
    <tr>
        <th>商品名</th>
        <th>商品の色</th>
        <th>メーカー名</th>
        <th>単価</th>
        <th>数量</th>
    </tr>

    {% for cart in cart_list %}
    <tr>
        <td>{{ cart.item.name }}</td>
        <td>{{ cart.item.color }}</td>
        <td>{{ cart.item.manufacturer }}</td>
        <td>{{ cart.item.price }}</td>
        <td>{{ cart.amount }}</td>
    </tr>
    {% endfor %}

</table>
合計{{total}}円

<br>
<a href="/shopapp/">商品検索へ</a>

</body>
