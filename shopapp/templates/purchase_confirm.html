<h2>購入確認画面</h2>

注文者：{{ user.name }}<br>
配送先：{{ destination }}<br>

<table border="1">
<tr>
    <th>商品名</th>
    <th>数量</th>
    <th>単価</th>
</tr>

{% for cart in cart_list %}
<tr>
    <td>{{ cart.item.name }}</td>
    <td>{{ cart.amount }}</td>
    <td>{{ cart.item.price }}円</td>
</tr>
{% endfor %}
</table>
合計 {{ total }}円　決済方法：{{ cash }}

<form action="/shopapp/purchaseCommit/" method="post">
<input type="hidden" name="destination" value="{{ destination }}">
<br>
<input type="submit" value="購入確定">
</form>
