{% extends 'base.html' %}
{% block title %}配送先情報の入力{% endblock %}

{% block content %}
<div class="container-sm">
  <p class="page-eyebrow">CHECKOUT</p>
  <h1 class="page-title">配送先情報の入力</h1>

  <form action="/shopapp/purchaseConfirm/" method="post">
    {% csrf_token %}

    <div class="card" style="margin-bottom: 28px;">
      <div class="form-group">
        <label class="form-label">会員ID</label>
        <p class="info-value" style="padding: 4px 0;">{{ user.user_id }}</p>
      </div>
      <div class="form-group">
        <label class="form-label">お名前</label>
        <p class="info-value" style="padding: 4px 0;">{{ user.name }}</p>
      </div>
      <div class="form-group">
        <label class="form-label">配送先</label>
        <input type="text" name="destination" value="{{ user.address }}">
      </div>
      <div class="form-group">
        <label class="form-label">決済方法</label>
        <select name="cash">
          <option value="代金引換">代金引換</option>
        </select>
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-full">購入内容を確認する</button>
  </form>

  <a href="/shopapp/cart" class="back-link">カートへ戻る</a>
</div>
{% endblock %}
