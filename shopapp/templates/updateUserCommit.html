{% extends 'base.html' %}
{% block title %}会員情報の更新完了{% endblock %}

{% block content %}
<div class="container-sm">
  <p class="page-eyebrow">MY ACCOUNT</p>
  <h1 class="page-title">会員情報を更新しました</h1>

  <div class="card" style="margin-bottom: 32px;">
    <ul class="info-list">
      <li>
        <span class="info-label">会員ID</span>
        <span class="info-value">{{ user.user_id }}</span>
      </li>
      <li>
        <span class="info-label">パスワード</span>
        <span class="info-value">表示なし</span>
      </li>
      <li>
        <span class="info-label">お名前</span>
        <span class="info-value">{{ user.name }}</span>
      </li>
      <li>
        <span class="info-label">ご住所</span>
        <span class="info-value">{{ user.address }}</span>
      </li>
    </ul>
  </div>

  <a href="/shopapp/" class="btn btn-secondary">商品検索へ</a>
</div>
{% endblock %}
