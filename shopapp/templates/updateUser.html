{% extends 'base.html' %}
{% block title %}会員情報の変更{% endblock %}

{% block content %}
<div class="container-sm">
  <p class="page-eyebrow">MY ACCOUNT</p>
  <h1 class="page-title">会員情報の変更</h1>

  <div class="card">
    <form action="/shopapp/updateUserConfirm/" method="post">
      {% csrf_token %}

      {% if errors %}
        <div class="alert alert-error">{{ errors }}</div>
      {% endif %}

      <div class="form-group">
        <label class="form-label">会員ID</label>
        <input type="text" name="user_id" value="{{ user.user_id }}" readonly>
      </div>
      <div class="form-group">
        <label class="form-label">新しいパスワード</label>
        {{ form.password }}
      </div>
      <div class="form-group">
        <label class="form-label">新しいパスワード（確認）</label>
        {{ form.password_confirm }}
      </div>
      <div class="form-group">
        <label class="form-label">お名前</label>
        {{ form.name }}
      </div>
      <div class="form-group">
        <label class="form-label">ご住所</label>
        {{ form.address }}
      </div>

      <div style="margin-top: 28px;">
        <button type="submit" class="btn btn-primary btn-full">変更内容を確認する</button>
      </div>
    </form>
  </div>

  <div style="margin-top: 32px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;">
    <a href="/shopapp/" class="back-link" style="margin-top: 0;">商品検索へ戻る</a>
    <a href="/shopapp/deleteConfirm/" class="btn btn-danger btn-sm">退会する</a>
  </div>
</div>
{% endblock %}
