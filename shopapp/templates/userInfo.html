{% load static %}
<!DOCTYPE html>

<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <title>会員情報の確認</title>
        <link rel="stylesheet" type='text/css' href="{% static 'style.css' %}"/>
    </head>

    <body>
        <h2>
            会員情報
        </h2>
        <table border="1">
            <tr>
                <th>会員ID</th>
                <td>{{user.user_id}}</td>
            </tr>
            <tr>
                <th>パスワード</th>
                <td>表示なし</td>
            </tr>
            <tr>
                <th>お名前</th>
                <td>{{user.name}}</td>
            </tr>
            <tr>
                <th>ご住所</th>
                <td>{{user.address}}</td>
            </tr>

        </table>

        <br>
        <a href="/shopapp/updateUser/">会員情報の変更</a><br>
        <a href="/shopapp/">商品検索へ</a>
    </body>
